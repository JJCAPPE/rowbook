name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

jobs:
  pr-fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowbook_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rowbook_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/rowbook_ci?schema=public
      TEST_AUTH_BYPASS: "1"
      E2E_ENABLED: "1"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: proof-images
      AUTH_SECRET: test-auth-secret-with-minimum-length
      CRON_SECRET: test-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate schema for app/e2e DB
        run: npx prisma migrate deploy --schema apps/web/src/db/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Integration smoke tests
        run: npm run test:integration -- --grep @smoke

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e -- --grep @smoke

  scheduled-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowbook_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rowbook_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/rowbook_ci?schema=public
      TEST_AUTH_BYPASS: "1"
      E2E_ENABLED: "1"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_STORAGE_BUCKET: proof-images
      AUTH_SECRET: test-auth-secret-with-minimum-length
      CRON_SECRET: test-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate schema for app/e2e DB
        run: npx prisma migrate deploy --schema apps/web/src/db/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Full integration suite
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full E2E suite
        run: npm run test:e2e
